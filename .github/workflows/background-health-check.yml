name: APA SMC background health check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: apa-smc-background-health-check-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  health-check:
    name: Check website, market feeds, and safety guards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run background health checks
        run: node scripts/background-health-check.mjs

      - name: Run production strategy source coverage audit
        if: github.event_name != 'schedule'
        run: node scripts/production-strategy-source-audit.mjs

      - name: Run internal engineering regression audit
        if: github.event_name != 'schedule'
        run: node scripts/engineering-audit.mjs

      - name: Run strategy core unit tests
        if: github.event_name != 'schedule'
        run: node --test scripts/strategy-core.test.mjs

      - name: Run SMC detector unit tests
        if: github.event_name != 'schedule'
        run: node --test scripts/smc-detectors.test.mjs

      - name: Run strategy discovery unit tests
        if: github.event_name != 'schedule'
        run: node --test scripts/strategy-discovery.test.mjs

      - name: Run research backtest unit tests
        if: github.event_name != 'schedule'
        run: node --test scripts/research-backtest.test.mjs

      - name: Run app timeframe and candle refresh regression tests
        if: github.event_name != 'schedule'
        run: node --test scripts/app-timeframe-health-check.test.mjs

      - name: Run production signal lifecycle regression tests
        if: github.event_name != 'schedule'
        run: node --test scripts/signal-lifecycle-regression.test.mjs

      - name: Run production chart signal parity regression tests
        if: github.event_name != 'schedule'
        run: node --test scripts/chart-signal-parity.test.mjs

      - name: Test uploaded-book strategy registry and RR gate
        if: github.event_name != 'schedule'
        run: node --test scripts/book-strategy-registry.test.mjs

      - name: Test deterministic LowKey book-rule primitives
        if: github.event_name != 'schedule'
        run: node --test scripts/book-rule-detectors.test.mjs

      - name: Test shared market event primitives
        if: github.event_name != 'schedule'
        run: node --test scripts/shared-market-events.test.mjs

      - name: Test production top-down timeframe alignment gate
        if: github.event_name != 'schedule'
        run: node --test scripts/top-down-alignment.test.mjs

      - name: Replay actual production scanner against deterministic candle fixtures
        if: github.event_name != 'schedule'
        run: node --test scripts/production-scanner-replay.test.mjs
