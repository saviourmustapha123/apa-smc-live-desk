name: APA SMC code validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apa-smc-code-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-validation:
    name: Deterministic code and rule validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run production scanner replay tests
        run: node --test scripts/production-scanner-replay.test.mjs

      - name: Run APA SMC strategy-rule regression tests
        run: node --test scripts/strategy-rule-regression.test.mjs

      - name: Run production strategy source coverage audit
        run: node scripts/production-strategy-source-audit.mjs

      - name: Run internal engineering regression audit
        run: node scripts/engineering-audit.mjs

      - name: Run complete deterministic test suite
        run: node --test scripts/*.test.mjs

      - name: Run 1-minute entry and trade-outcome regression tests
        run: node --test scripts/trade-entry-replay.test.mjs

      - name: Run chart and lifecycle parity tests
        run: node --test scripts/chart-signal-parity.test.mjs scripts/signal-lifecycle-regression.test.mjs
