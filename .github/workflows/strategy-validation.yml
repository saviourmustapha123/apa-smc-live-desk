name: APA SMC daily strategy validation

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

concurrency:
  group: apa-smc-strategy-validation
  cancel-in-progress: false

jobs:
  strategy-validation:
    name: Unit tests and rolling proxy backtest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run strategy core unit tests
        run: node --test scripts/strategy-core.test.mjs

      - name: Run rolling historical proxy backtest
        run: node scripts/proxy-backtest.mjs
